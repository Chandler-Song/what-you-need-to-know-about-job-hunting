<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#0f2341"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a365d"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="6" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Book shadow -->
  <rect x="8" y="8" width="344" height="484" rx="4" fill="#000" opacity="0.15" filter="url(#shadow)"/>
  <!-- Book cover -->
  <rect x="0" y="0" width="360" height="500" rx="4" fill="url(#coverBg)"/>
  <!-- Spine effect -->
  <rect x="0" y="0" width="26" height="500" rx="4" fill="url(#spineGrad)"/>
  <line x1="26" y1="0" x2="26" y2="500" stroke="#7b9ec7" stroke-width="0.5" opacity="0.4"/>
  <!-- Decorative border -->
  <rect x="40" y="24" width="300" height="452" rx="2" fill="none" stroke="#7b9ec7" stroke-width="1" opacity="0.25"/>
  <!-- Title -->
  <text x="190" y="80" text-anchor="middle" font-family="serif" font-size="26" font-weight="bold" fill="#f8f9fa">关于求职</text>
  <text x="190" y="118" text-anchor="middle" font-family="serif" font-size="22" fill="#e0e2e8">你要知道的那些事</text>
  <!-- Divider -->
  <line x1="90" y1="145" x2="290" y2="145" stroke="#7b9ec7" stroke-width="1.5" opacity="0.6"/>
  <!-- Subtitle -->
  <text x="190" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a0b4cc">一个猎头老炮儿的10年血泪真经</text>
  <!-- Part icons row - 5 parts -->
  <g transform="translate(44, 210)">
    <!-- Part 1 -->
    <g transform="translate(0, 0)">
      <rect x="2" y="2" width="48" height="48" rx="6" fill="#7b9ec7" opacity="0.15"/>
      <text x="26" y="35" text-anchor="middle" font-size="22">🔍</text>
      <text x="26" y="66" text-anchor="middle" font-size="8" fill="#a0b4cc">祛魅</text>
    </g>
    <!-- Part 2 -->
    <g transform="translate(56, 0)">
      <rect x="2" y="2" width="48" height="48" rx="6" fill="#7b9ec7" opacity="0.15"/>
      <text x="26" y="35" text-anchor="middle" font-size="22">🪞</text>
      <text x="26" y="66" text-anchor="middle" font-size="8" fill="#a0b4cc">备战</text>
    </g>
    <!-- Part 3 -->
    <g transform="translate(112, 0)">
      <rect x="2" y="2" width="48" height="48" rx="6" fill="#7b9ec7" opacity="0.15"/>
      <text x="26" y="35" text-anchor="middle" font-size="22">⚔️</text>
      <text x="26" y="66" text-anchor="middle" font-size="8" fill="#a0b4cc">出牌</text>
    </g>
    <!-- Part 4 -->
    <g transform="translate(168, 0)">
      <rect x="2" y="2" width="48" height="48" rx="6" fill="#7b9ec7" opacity="0.15"/>
      <text x="26" y="35" text-anchor="middle" font-size="22">💰</text>
      <text x="26" y="66" text-anchor="middle" font-size="8" fill="#a0b4cc">谈判</text>
    </g>
    <!-- Part 5 -->
    <g transform="translate(224, 0)">
      <rect x="2" y="2" width="48" height="48" rx="6" fill="#7b9ec7" opacity="0.15"/>
      <text x="26" y="35" text-anchor="middle" font-size="22">🗺️</text>
      <text x="26" y="66" text-anchor="middle" font-size="8" fill="#a0b4cc">进化</text>
    </g>
  </g>
  <!-- Chapter list - compact -->
  <g font-family="sans-serif" font-size="9" fill="#7b9ec7" opacity="0.8">
    <text x="60" y="310">第1-3章</text>
    <text x="120" y="310" fill="#a0b4cc" font-size="8">把求职这件事看清楚</text>
    <text x="60" y="328">第4-6章</text>
    <text x="120" y="328" fill="#a0b4cc" font-size="8">上场之前先做人前的功课</text>
    <text x="60" y="346">第7-11章</text>
    <text x="125" y="346" fill="#a0b4cc" font-size="8">面试是一场有剧本的即兴表演</text>
    <text x="60" y="364">第12-13章</text>
    <text x="130" y="364" fill="#a0b4cc" font-size="8">Offer只是起点，薪资才是终局</text>
    <text x="60" y="382">第14-16章</text>
    <text x="130" y="382" fill="#a0b4cc" font-size="8">求职只是起点，职业才是终身命题</text>
  </g>
  <!-- Bottom info -->
  <text x="190" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7b9ec7">5 大部分 · 16 章 · 79 节 · 实战导向</text>
  <!-- Bottom decorative -->
  <line x1="110" y1="440" x2="270" y2="440" stroke="#7b9ec7" stroke-width="0.5" opacity="0.4"/>
  <text x="190" y="460" text-anchor="middle" font-family="serif" font-size="11" fill="#a0b4cc" opacity="0.7">求职指南</text>
</svg>
