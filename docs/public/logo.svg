<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="8" fill="#f5f0e8"/>
  <g transform="translate(12, 8)">
    <!-- Book body -->
    <rect x="4" y="4" width="32" height="40" rx="2" fill="#2d7a8a"/>
    <!-- Spine -->
    <rect x="4" y="4" width="6" height="40" rx="1" fill="#1a4a5a"/>
    <!-- Pages -->
    <line x1="14" y1="12" x2="32" y2="12" stroke="#f5f0e8" stroke-width="1.5" opacity="0.5"/>
    <line x1="14" y1="18" x2="32" y2="18" stroke="#f5f0e8" stroke-width="1.5" opacity="0.5"/>
    <line x1="14" y1="24" x2="28" y2="24" stroke="#f5f0e8" stroke-width="1.5" opacity="0.5"/>
    <line x1="14" y1="30" x2="30" y2="30" stroke="#f5f0e8" stroke-width="1.5" opacity="0.5"/>
    <line x1="14" y1="36" x2="26" y2="36" stroke="#f5f0e8" stroke-width="1.5" opacity="0.5"/>
    <!-- Arrow accent (orange, matching cover) -->
    <polygon points="28,20 36,14 36,22" fill="#e8872a"/>
  </g>
</svg>
